[project]
name = "homeintent-moonshine-stt"
version = "0.2.2"
description = "German speech-to-text (Moonshine) and text-to-speech (Kyutai Pocket TTS)"
requires-python = ">=3.11"
dependencies = [
    "moonshine-voice==0.1.5",
    "wyoming==1.10.2",
    "numpy==2.4.6",
    "websockets==17.1",
    "pocket-tts==3.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not e2e'"
markers = [
    "e2e: real Wyoming round-trip against a downloaded model/TTS voice (slow, needs network; run explicitly with -m e2e)",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "moonshine_voice"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pocket_tts"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# PyYAML is only used by CI-only test helpers (verifying the fake
# Supervisor stub against config.yaml), never by the shipped add-on itself.
module = "yaml"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "C90",         # mccabe
    "UP",          # pyupgrade
    "B",           # flake8-bugbear
    "C4",          # flake8-comprehensions
    "SIM",         # flake8-simplify
]
ignore = ["E501"]  # Line too long (handled by formatter)
