[project]
name = "homeintent-moonshine-stt"
version = "0.4.0"
description = "German speech-to-text (Moonshine, Kroko) and text-to-speech (Kyutai Pocket TTS, Kokoro ONNX, Supertonic 3)"
requires-python = ">=3.11"
dependencies = [
    "moonshine-voice==0.1.5",
    "wyoming==1.10.2",
    "numpy==2.4.6",
    "websockets==17.1",
    "pocket-tts==3.1.0",
    "huggingface_hub==1.32.0",
    "kokoro-onnx==0.6.1",
    "onnxruntime==1.30.0",
    "espeakng-loader==0.2.4",
    "phonemizer==3.4.0",
    "sherpa-onnx==1.13.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not e2e'"
markers = [
    "e2e: real Wyoming round-trip against a downloaded model/TTS voice (slow, needs network; run explicitly with -m e2e)",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "moonshine_voice"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pocket_tts"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# PyYAML is only used by CI-only test helpers (verifying the fake
# Supervisor stub against config.yaml), never by the shipped add-on itself.
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# requests/huggingface_hub.utils are only used by app/tests/e2e_infra.py to
# classify real e2e failures; whether type stubs are present for them
# varies between environments (present transitively via moonshine-voice/
# pocket-tts's own dependency resolution, absent in a minimal local
# install) -- ignore_missing_imports avoids that divergence causing CI to
# fail on an "unused ignore" where a plain inline comment would not.
module = ["requests.*", "huggingface_hub.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# onnxruntime and kokoro_onnx ship no py.typed marker/stubs.
module = ["onnxruntime", "onnxruntime.*", "kokoro_onnx", "kokoro_onnx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# sherpa_onnx ships no py.typed marker/stubs (its Python surface is a
# pybind11 C extension).
module = ["sherpa_onnx", "sherpa_onnx.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "C90",         # mccabe
    "UP",          # pyupgrade
    "B",           # flake8-bugbear
    "C4",          # flake8-comprehensions
    "SIM",         # flake8-simplify
]
ignore = ["E501"]  # Line too long (handled by formatter)
