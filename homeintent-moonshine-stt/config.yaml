---
name: HomeIntent Moonshine Voice
# Slug intentionally left as "homeintent-moonshine-stt" (its v0.1.x value) so
# existing installations upgrade in place rather than appearing as a brand
# new add-on -- see ABSCHLUSSBERICHT_V0.2.0.md's "Add-on name / slug" section.
version: 0.2.3
slug: homeintent-moonshine-stt
description: Local German speech-to-text (Moonshine) and text-to-speech (Kyutai Pocket TTS) over Wyoming
url: https://github.com/pquandel2-alt/homeintent-moonshine-addon
arch:
  - amd64
  - aarch64
init: false
discovery:
  - wyoming
ports:
  "10300/tcp": null
backup_exclude:
  - "models/*"
  - "debug_audio/*"
# Grants proxied, read-only-by-our-own-usage access to the HA Core REST API
# (http://supervisor/core/api/) and WebSocket API (ws://supervisor/core/websocket)
# via SUPERVISOR_TOKEN. Used only by app/ha_vocabulary.py to read Area/Device/
# Entity/Floor registries for use_ha_vocabulary -- never to call a service,
# change a state, or edit an automation/entity.
homeassistant_api: true
options:
  stt_enabled: true
  model: small
  language: de
  log_level: INFO
  log_transcripts: false
  log_performance: true
  extra_keyterms: ""
  keyterm_boost: 2.0
  use_ha_vocabulary: true
  ha_vocabulary_refresh_minutes: 30
  transcription_interval: 0.5
  vad_threshold: 0.5
  decode_incomplete_lines: true
  save_debug_audio: false
  debug_audio_max_files: 100
  # TTS defaults to OFF on upgrade: an existing pure-STT installation must
  # not suddenly download an extra PyTorch + Pocket TTS model (several
  # hundred MB) and grow its startup time. New installations are documented
  # (README) to turn it on. See ABSCHLUSSBERICHT_V0.2.0.md, "Backward
  # compatibility" section, for the full reasoning.
  tts_enabled: false
  tts_model: german
  tts_voice: juergen
  tts_log_performance: true
  tts_warmup: true
schema:
  stt_enabled: bool
  model: list(tiny|small)
  language: list(de)
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  log_transcripts: bool
  log_performance: bool
  extra_keyterms: str
  keyterm_boost: float(0.0,10.0)
  use_ha_vocabulary: bool
  ha_vocabulary_refresh_minutes: int(0,1440)
  transcription_interval: float(0.05,10.0)
  vad_threshold: float(0.0,1.0)
  decode_incomplete_lines: bool
  save_debug_audio: bool
  debug_audio_max_files: int(1,10000)
  tts_enabled: bool
  tts_model: list(german|german_24l)
  tts_voice: str
  tts_log_performance: bool
  tts_warmup: bool
homeassistant: "2023.11.0"
