name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install pytest pytest-asyncio numpy==2.4.6 moonshine-voice wyoming websockets==17.1 pyyaml pocket-tts
      - run: pytest homeintent-moonshine-stt/app/tests/ -v
