name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install pytest pytest-asyncio numpy moonshine-voice wyoming
      - run: pytest homeintent-moonshine-stt/app/tests/ -v
