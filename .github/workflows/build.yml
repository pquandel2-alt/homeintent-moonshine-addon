name: Build

on: [push, pull_request]

jobs:
  build-amd64:
    name: Build amd64 image + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: pip install pyyaml wyoming

      - name: Resolve BUILD_FROM from build.yaml
        id: build_from
        run: |
          value=$(python3 -c "
          import yaml
          with open('homeintent-moonshine-stt/build.yaml') as f:
              print(yaml.safe_load(f)['build_from']['amd64'])
          ")
          echo "value=${value}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: homeintent-moonshine-stt
          platforms: linux/amd64
          push: false
          load: true
          tags: homeintent-moonshine-stt:amd64-ci
          build-args: |
            BUILD_FROM=${{ steps.build_from.outputs.value }}

      - name: Create isolated network with a fake Supervisor API
        run: |
          docker network create moonshine-ci
          docker run -d --name supervisor --network moonshine-ci \
            -v "${GITHUB_WORKSPACE}/.github/ci/fake_supervisor.py:/fake_supervisor.py:ro" \
            -e CI_MODEL=tiny \
            python:3.11-slim python3 /fake_supervisor.py

      - name: Wait for the fake Supervisor to actually accept connections
        run: |
          # docker run -d returns as soon as the container starts, not once the Python
          # HTTP server inside is listening. bashio::config hits the Supervisor API on
          # the add-on's very first start, and s6-overlay treats a service failing on
          # that first attempt as fatal (tears the whole container down) -- so a slow
          # supervisor stub here is not just a delay, it fails the whole smoke test.
          for i in $(seq 1 30); do
            if docker exec supervisor python3 -c "
          import urllib.request
          urllib.request.urlopen('http://localhost/addons/self/options/config', timeout=2)
          " 2>/dev/null; then
              echo "Fake Supervisor ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Fake Supervisor stub never became ready"
          docker logs supervisor || true
          exit 1

      - name: Start add-on container via its real /init entrypoint
        run: |
          docker run -d --name moonshine-test --network moonshine-ci \
            -e SUPERVISOR_TOKEN=ci-test-token \
            -p 10300:10300 \
            homeintent-moonshine-stt:amd64-ci

      - name: Real Wyoming describe round trip (polls until server is actually ready)
        timeout-minutes: 8
        run: |
          export PYTHONPATH=homeintent-moonshine-stt
          for i in $(seq 1 240); do
            if python3 -m app.healthcheck; then
              echo "Real Wyoming describe succeeded after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Wyoming server never answered a real describe request"
          exit 1

      - name: Container logs
        if: always()
        run: |
          echo "::group::moonshine-test logs"
          docker logs moonshine-test || true
          echo "::endgroup::"
          echo "::group::supervisor stub logs"
          docker logs supervisor || true
          echo "::endgroup::"

      - name: Clean up containers
        if: always()
        run: |
          docker rm -f moonshine-test supervisor || true
          docker network rm moonshine-ci || true

  e2e-audio-transcribe:
    name: Real German audio E2E Wyoming round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: pip install pytest pytest-asyncio numpy moonshine-voice wyoming websockets==17.1

      - name: Synthesize German audio, transcribe it, and check the result
        run: |
          cd homeintent-moonshine-stt
          python3 -m pytest app/tests/test_e2e_transcribe.py -v -m e2e -rs

  build-aarch64:
    name: Build aarch64 image (QEMU, build-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      - name: Resolve BUILD_FROM from build.yaml
        id: build_from
        run: |
          value=$(python3 -c "
          import yaml
          with open('homeintent-moonshine-stt/build.yaml') as f:
              print(yaml.safe_load(f)['build_from']['aarch64'])
          ")
          echo "value=${value}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build aarch64 image
        uses: docker/build-push-action@v6
        with:
          context: homeintent-moonshine-stt
          platforms: linux/arm64
          push: false
          load: false
          tags: homeintent-moonshine-stt:aarch64-ci
          build-args: |
            BUILD_FROM=${{ steps.build_from.outputs.value }}
