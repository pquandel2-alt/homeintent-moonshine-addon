name: Build

on:
  push: {}
  pull_request: {}
  # Lets the real Pocket TTS e2e job (below) be run on demand from the
  # Actions UI without adding a real model download to every normal push/PR
  # -- see e2e-tts-synthesize's own `if:` condition.
  workflow_dispatch:
    inputs:
      regenerate_fixture:
        description: "Also regenerate the STT test audio fixture (uploads a new WAV as an artifact; does not commit it)"
        type: boolean
        default: false

jobs:
  build-amd64:
    name: Build amd64 image + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: pip install pyyaml wyoming

      - name: Resolve BUILD_FROM from build.yaml
        id: build_from
        run: |
          value=$(python3 -c "
          import yaml
          with open('homeintent-moonshine-stt/build.yaml') as f:
              print(yaml.safe_load(f)['build_from']['amd64'])
          ")
          echo "value=${value}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: homeintent-moonshine-stt
          platforms: linux/amd64
          push: false
          load: true
          tags: homeintent-moonshine-stt:amd64-ci
          build-args: |
            BUILD_FROM=${{ steps.build_from.outputs.value }}

      - name: Create isolated network with a fake Supervisor API
        run: |
          docker network create moonshine-ci
          docker run -d --name supervisor --network moonshine-ci \
            -v "${GITHUB_WORKSPACE}/.github/ci/fake_supervisor.py:/fake_supervisor.py:ro" \
            -v "${GITHUB_WORKSPACE}/homeintent-moonshine-stt/config.yaml:/config.yaml:ro" \
            -e CI_MODEL=tiny \
            python:3.11-slim python3 /fake_supervisor.py

      - name: Wait for the fake Supervisor to actually accept connections
        run: |
          # docker run -d returns as soon as the container starts, not once the Python
          # HTTP server inside is listening. bashio::config hits the Supervisor API on
          # the add-on's very first start, and s6-overlay treats a service failing on
          # that first attempt as fatal (tears the whole container down) -- so a slow
          # supervisor stub here is not just a delay, it fails the whole smoke test.
          for i in $(seq 1 30); do
            if docker exec supervisor python3 -c "
          import urllib.request
          urllib.request.urlopen('http://localhost/addons/self/options/config', timeout=2)
          " 2>/dev/null; then
              echo "Fake Supervisor ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Fake Supervisor stub never became ready"
          docker logs supervisor || true
          exit 1

      - name: Start add-on container via its real /init entrypoint
        run: |
          docker run -d --name moonshine-test --network moonshine-ci \
            -e SUPERVISOR_TOKEN=ci-test-token \
            -p 10300:10300 \
            homeintent-moonshine-stt:amd64-ci

      - name: Real Wyoming describe round trip (polls until server is actually ready)
        timeout-minutes: 8
        run: |
          export PYTHONPATH=homeintent-moonshine-stt
          for i in $(seq 1 240); do
            if python3 -m app.healthcheck; then
              echo "Real Wyoming describe succeeded after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Wyoming server never answered a real describe request"
          exit 1

      - name: Container logs
        if: always()
        run: |
          echo "::group::moonshine-test logs"
          docker logs moonshine-test || true
          echo "::endgroup::"
          echo "::group::supervisor stub logs"
          docker logs supervisor || true
          echo "::endgroup::"

      - name: Clean up containers
        if: always()
        run: |
          docker rm -f moonshine-test supervisor || true
          docker network rm moonshine-ci || true

      - name: Create isolated network with an upgrade-simulating fake Supervisor API
        run: |
          # Simulates upgrading from an old add-on version whose persisted
          # options.json predates several newer config.yaml options (they
          # are simply absent from the Supervisor response bashio::config
          # sees), plus two options a partially-migrated config left as
          # JSON null. Regression test for the bug where the run script
          # forwarded an unset/null value straight to argparse (e.g.
          # "--keyterm-boost null") and crashed the whole add-on on every
          # start (see ABSCHLUSSBERICHT_V0.1.2.md).
          docker network create moonshine-ci-upgrade
          docker run -d --name supervisor-upgrade --network moonshine-ci-upgrade \
            -v "${GITHUB_WORKSPACE}/.github/ci/fake_supervisor.py:/fake_supervisor.py:ro" \
            -v "${GITHUB_WORKSPACE}/homeintent-moonshine-stt/config.yaml:/config.yaml:ro" \
            -e CI_MODEL=tiny \
            -e CI_OMIT_OPTIONS="log_performance,use_ha_vocabulary,ha_vocabulary_refresh_minutes,transcription_interval,decode_incomplete_lines,save_debug_audio,debug_audio_max_files,stt_enabled,tts_enabled,tts_model,tts_voice,tts_log_performance,tts_warmup" \
            -e CI_NULL_OPTIONS="keyterm_boost,vad_threshold" \
            python:3.11-slim python3 /fake_supervisor.py

      - name: Wait for the upgrade-simulating fake Supervisor to accept connections
        run: |
          for i in $(seq 1 30); do
            if docker exec supervisor-upgrade python3 -c "
          import urllib.request
          urllib.request.urlopen('http://localhost/addons/self/options/config', timeout=2)
          " 2>/dev/null; then
              echo "Upgrade-simulating fake Supervisor ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Upgrade-simulating fake Supervisor stub never became ready"
          docker logs supervisor-upgrade || true
          exit 1

      - name: Start add-on container against the upgrade-simulating Supervisor
        run: |
          docker run -d --name moonshine-test-upgrade --network moonshine-ci-upgrade \
            -e SUPERVISOR_TOKEN=ci-test-token \
            -p 10301:10300 \
            homeintent-moonshine-stt:amd64-ci

      - name: Real Wyoming describe round trip against the upgrade-simulating add-on
        timeout-minutes: 8
        run: |
          export PYTHONPATH=homeintent-moonshine-stt
          export MOONSHINE_HEALTHCHECK_PORT=10301
          for i in $(seq 1 240); do
            if python3 -m app.healthcheck; then
              echo "Real Wyoming describe succeeded after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Add-on with missing/null options never came up (upgrade-safety regression)"
          exit 1

      - name: Upgrade-simulating container logs
        if: always()
        run: |
          echo "::group::moonshine-test-upgrade logs"
          docker logs moonshine-test-upgrade || true
          echo "::endgroup::"
          echo "::group::supervisor-upgrade stub logs"
          docker logs supervisor-upgrade || true
          echo "::endgroup::"

      - name: Clean up upgrade-simulating containers
        if: always()
        run: |
          docker rm -f moonshine-test-upgrade supervisor-upgrade || true
          docker network rm moonshine-ci-upgrade || true

  e2e-audio-transcribe:
    name: Real German audio E2E Wyoming round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: pip install pytest pytest-asyncio -r homeintent-moonshine-stt/requirements-runtime.txt

      - name: Transcribe the fixed audio fixture and check the result
        # Release gate: on a version tag, a SKIPPED result (e.g. the
        # Moonshine model being unreachable) must not be mistaken for proof
        # the real model works -- fail instead of skipping (see
        # app/tests/e2e_infra.py).
        env:
          E2E_REQUIRE_ONLINE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
        run: |
          cd homeintent-moonshine-stt
          python3 -m pytest app/tests/test_e2e_transcribe.py -v -m e2e -rs

  e2e-tts-synthesize:
    name: Real German Pocket TTS E2E Wyoming round-trip
    # Downloads a real Pocket TTS model + voice state on every run -- kept
    # out of the normal push/PR pipeline (see B30 review note /
    # ABSCHLUSSBERICHT_V0.2.0.md), only runs when triggered manually via
    # `workflow_dispatch`, or automatically as a release gate on a version
    # tag (`v*`) push -- a release must never ship without this having
    # actually run and passed, see ABSCHLUSSBERICHT_V0.2.3.md.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: pip install pytest pytest-asyncio -r homeintent-moonshine-stt/requirements-runtime.txt

      - name: Synthesize German text with Pocket TTS and check the audio
        env:
          E2E_REQUIRE_ONLINE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
        run: |
          cd homeintent-moonshine-stt
          python3 -m pytest app/tests/test_e2e_tts.py -v -m e2e -rs

  generate-stt-fixture:
    name: Regenerate STT test audio fixture (manual only, uploads artifact)
    # Never runs automatically -- only when explicitly requested via the
    # workflow_dispatch "regenerate_fixture" input (see
    # app/tests/fixtures/README.md for why this needs real network access
    # this repository's own CI has, but a local sandbox may not). Uploads
    # the new WAV as a build artifact for manual review and commit -- it is
    # never committed automatically.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.regenerate_fixture == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          pip install scipy pytest pytest-asyncio -r homeintent-moonshine-stt/requirements-runtime.txt

      - name: Generate fixture
        run: |
          cd homeintent-moonshine-stt
          python3 scripts/generate_stt_fixture.py app/tests/fixtures/schalte_lampe_wohnzimmer.wav

      - name: Verify the freshly generated fixture actually transcribes correctly
        env:
          E2E_REQUIRE_ONLINE: "1"
        run: |
          cd homeintent-moonshine-stt
          python3 -m pytest app/tests/test_e2e_transcribe.py -v -m e2e

      - uses: actions/upload-artifact@v4
        with:
          name: schalte_lampe_wohnzimmer-wav
          path: homeintent-moonshine-stt/app/tests/fixtures/schalte_lampe_wohnzimmer.wav
          retention-days: 14

      - name: Print fixture as base64 (artifact download is blocked from the dev sandbox)
        run: |
          echo "===FIXTURE_B64_START==="
          base64 -w0 homeintent-moonshine-stt/app/tests/fixtures/schalte_lampe_wohnzimmer.wav
          echo ""
          echo "===FIXTURE_B64_END==="

  build-aarch64:
    name: Build aarch64 image (QEMU, build-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: pip install pyyaml

      - name: Resolve BUILD_FROM from build.yaml
        id: build_from
        run: |
          value=$(python3 -c "
          import yaml
          with open('homeintent-moonshine-stt/build.yaml') as f:
              print(yaml.safe_load(f)['build_from']['aarch64'])
          ")
          echo "value=${value}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build aarch64 image
        uses: docker/build-push-action@v6
        with:
          context: homeintent-moonshine-stt
          platforms: linux/arm64
          push: false
          load: false
          tags: homeintent-moonshine-stt:aarch64-ci
          build-args: |
            BUILD_FROM=${{ steps.build_from.outputs.value }}
