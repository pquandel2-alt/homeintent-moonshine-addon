name: Type Check

on: [push, pull_request]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install mypy numpy==2.4.6 moonshine-voice wyoming websockets==17.1 pytest pytest-asyncio pyyaml pocket-tts
      - run: mypy --config-file homeintent-moonshine-stt/app/pyproject.toml homeintent-moonshine-stt/app/
