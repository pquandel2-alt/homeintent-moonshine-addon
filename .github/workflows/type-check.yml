name: Type Check

on: [push, pull_request]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install mypy numpy moonshine-voice wyoming
      - run: mypy homeintent-moonshine-stt/app/ --ignore-missing-imports
